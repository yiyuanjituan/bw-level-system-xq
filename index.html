<!DOCTYPE html>
<html lang="zh" data-theme="1">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
    <meta name="theme-color" content="#20b98b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="YGAME" />
    <link rel="manifest" href="%VITE_PUBLIC_PATH%manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="%VITE_PUBLIC_PATH%pwa/icon-180.png" />
    <link rel="icon" href="/favicon.ico" />
    <script src="/siteadmin/file/js/telegram-web-app.js" defer></script>
  </head>
  <body>
    <div id="app"></div>
    <script src="%VITE_PUBLIC_PATH%runtime-config.js"></script>
    <script type="module" src="/src/main.ts"></script>
    <% if (ENABLE_ERUDA === "true") { %>
      <script src="//cdn.jsdelivr.net/npm/eruda" defer></script>
      <script defer>
        document.addEventListener("DOMContentLoaded", function () {
          // 仅在调试脚本加载成功时初始化，避免第三方脚本异常阻断页面恢复。
          if (window.eruda && typeof window.eruda.init === "function") {
            window.eruda.init();
          }
        });
      </script>
    <% } %>
  </body>
</html>
