<!DOCTYPE html>
<html lang="en" data-theme="1">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
    <link rel="icon" href="/favicon.ico" />
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <style>
        .skeleton-screen-main {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1000;
            background: #000;
        }
        .skeleton-screen-main > .icon-skeleton {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .skeleton-screen-main .icon-skeleton ul {
            transform: rotate(45deg) translate(25px, 25px);
            width: 60px;
            height: 60px;
        }
        .icon-skeleton.spinner2 li {
            list-style-type: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            //animation: expand 1s ease-in-out infinite;
        }
        .icon-skeleton.spinner2 .a {
            animation: a 1s ease-in-out infinite;
        }
        .icon-skeleton.spinner2 .b {
            animation: b 1s ease-in-out infinite;
        }
        .icon-skeleton.spinner2 .c {
            animation: c 1s ease-in-out infinite;
        }
        .icon-skeleton.spinner2 .d {
            animation: d 1s ease-in-out infinite;
        }
        .icon-skeleton.spinner2 .e {
            animation: e 1s ease-in-out infinite;
        }
        .icon-skeleton.spinner2 .f {
            animation: f 1s ease-in-out infinite;
        }
        .icon-skeleton.spinner2 .g {
            animation: g 1s ease-in-out infinite;
        }
        .icon-skeleton.spinner2 .h {
            animation: h 1s ease-in-out infinite;
        }
        .icon-skeleton.spinner2 .i {
            animation: i 1s ease-in-out infinite;
        }
        @keyframes a {
            0% { top: 0; left: 0; }
            50% { top: -20px; left: -20px; }
            100% { top: -20px; left: -20px; }
        }
        @keyframes b {
            0% { top: 0; left: 0; }
            50% { top: -20px; left: 0; }
            100% { top: -20px; left: 0; }
        }
        @keyframes c {
            0% { top: 0; left: 0; }
            50% { top: -20px; left: 20px; }
            100% { top: -20px; left: 20px; }
        }
        @keyframes d {
            0% { top: 0; left: 0; }
            50% { top: 0; left: -20px; }
            100% { top: 0; left: -20px; }
        }
        @keyframes e {
            0% { top: 0; left: 0; }
            50% { top: 0; left: 0; }
            100% { top: 0; left: 0; }
        }
        @keyframes f {
            0% { top: 0; left: 0; }
            50% { top: 0; left: 20px; }
            100% { top: 0; left: 20px; }
        }
        @keyframes g {
            0% { top: 0; left: 0; }
            50% { top: 20px; left: -20px; }
            100% { top: 20px; left: -20px; }
        }
        @keyframes h {
            0% { top: 0; left: 0; }
            50% { top: 20px; left: 0; }
            100% { top: 20px; left: 0; }
        }
        @keyframes i {
            0% { top: 0; left: 0; }
            50% { top: 20px; left: 20px; }
            100% { top: 20px; left: 20px; }
        }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="skeleton-screen-main">
        <div class="icon-skeleton spinner2">
          <ul>
            <li class="a"></li>
            <li class="b"></li>
            <li class="c"></li>
            <li class="d"></li>
            <li class="e"></li>
            <li class="f"></li>
            <li class="g"></li>
            <li class="h"></li>
            <li class="i"></li>
          </ul>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>

  </body>
</html>
